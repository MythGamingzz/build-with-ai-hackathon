[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadence-local-analysis"
version = "0.1.0"
description = "Local experiment for aligning sung words and estimated chords"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=11,<19",
    "faster-whisper>=1.1,<2",
    "librosa>=0.11,<1",
    "scikit-learn>=1.5,<2",
]

[project.scripts]
cadence-analyze = "cadence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
